<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The academic and research portal of Leonard MacEachern and Intelligence Foundry at Carleton University.">
  <meta name="theme-color" content="#ffffff">
  <title>Leonard MacEachern | Research Portal</title>
  <link rel="icon" href="assets/intelligence-foundry-emblem.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="portal" aria-label="Choose a destination">
    <a class="destination destination--profile" href="https://maceacla.github.io/maceachern-profile/" aria-label="Visit Leonard MacEachern's professional profile">
      <div class="destination__inner">
        <img
          class="destination__emblem"
          src="assets/leonard-maceachern-emblem.png"
          width="900"
          height="900"
          alt="An open book, LM monogram, and radiating circuit traces"
        >

        <div class="destination__copy">
          <h1>Leonard MacEachern</h1>
          <p>Professor, researcher, engineer, and advisor.</p>
          <span class="destination__link">
            Professional profile
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path d="M5 12h14M14 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"/>
            </svg>
          </span>
        </div>
      </div>
    </a>

    <a class="destination destination--foundry" href="https://maceacla.github.io/intelligence-foundry/" aria-label="Visit Intelligence Foundry, part of the MacEachern Research Group">
      <div class="destination__inner">
        <img
          class="destination__emblem"
          src="assets/intelligence-foundry-emblem.png"
          width="900"
          height="900"
          alt="An IF monogram on an anvil with a silicon wafer and circuit traces"
        >

        <div class="destination__copy">
          <p class="destination__parent">MacEachern Research Group</p>
          <h2>Intelligence Foundry</h2>
          <p>Research in intelligent systems, circuits, computation, and discovery.</p>
          <span class="destination__link">
            Research group
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path d="M5 12h14M14 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"/>
            </svg>
          </span>
        </div>
      </div>
    </a>
  </main>

  <footer>
    <span>Carleton University</span>
    <span aria-hidden="true">&middot;</span>
    <span>Ottawa, Canada</span>
  </footer>
</body>
</html>
