<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The academic and research portal of Leonard MacEachern and the MOSAIC Group at Carleton University.">
  <meta name="theme-color" content="#ffffff">
  <title>Leonard MacEachern | Research Portal</title>
  <link rel="icon" href="assets/branding/mosaic-group-logo-colour.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="portal" aria-label="Choose a destination">
    <a class="destination destination--profile" href="https://maceacla.github.io/maceachern-profile/" aria-label="Visit Leonard MacEachern's professional profile">
      <div class="destination__inner">
        <img
          class="destination__emblem"
          src="assets/leonard-maceachern-emblem.png"
          width="900"
          height="900"
          alt="An open book, LM monogram, and radiating circuit traces"
        >

        <div class="destination__copy">
          <h1>Leonard MacEachern</h1>
          <p>Professor, researcher, engineer, and advisor.</p>
          <span class="destination__link">
            Professional profile
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path d="M5 12h14M14 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"/>
            </svg>
          </span>
        </div>
      </div>
    </a>

    <a class="destination destination--mosaic" href="https://maceacla.github.io/mosaic-group/" aria-label="Visit the MOSAIC Group research website">
      <div class="destination__inner destination__inner--mosaic">
        <img
          class="destination__emblem destination__emblem--mosaic"
          src="assets/branding/mosaic-group-logo-colour.png"
          width="1254"
          height="1254"
          alt="MOSAIC Group — Microelectronics, Optoelectronics, Sensing, and Adaptive Intelligent Circuits"
        >
        <span class="destination__link destination__link--mosaic">
          Visit the MOSAIC Group
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M5 12h14M14 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
        </span>
      </div>
    </a>
  </main>

  <footer>
    <span>Carleton University</span>
    <span aria-hidden="true">&middot;</span>
    <span>Ottawa, Canada</span>
  </footer>
</body>
</html>
